  <text x="270.0" y="544" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">leave sandbox · new host · deploy</text>
<path d="M670,530 L820,530" fill="none" stroke="#047857" stroke-width="1.7" marker-end="url(#a11arrG)"/>
<rect x="820" y="500" width="260" height="70" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" filter="url(#a11soft)"/>
  <text x="950.0" y="524" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Execute</text>
  <text x="950.0" y="544" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">in-policy · profile-scoped · OBO token</text>
<text x="465" y="508" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#D97706">out of policy</text>
<text x="745" y="508" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#047857">in policy</text>
<rect x="32" y="620" width="1216" height="200" rx="12" fill="#FFFFFF" stroke="#94A3B8"/>
<text x="52" y="650" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Maps to Example A controls</text>
<text x="52" y="680" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Sandbox / workspace writes  →  Principle 11 write-path deny + capability profile (ask/edit/vcs/deploy)</text>
<text x="52" y="708" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Network deny-by-default      →  EA egress allowlist + kill switch (Plane B/C)</text>
<text x="52" y="736" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Approval policy              →  Intent Gate + HITL on high-risk effects (destructive / prod / protected branch / new egress)</text>
<text x="52" y="764" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Secrets removed from env    →  Credential Broker (OBO token in Authorization header only)</text>
<text x="52" y="792" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">Closed IDE note: if you cannot insert the diamond inside the vendor loop, enforce the same rules at MCP proxy, API authZ, corporate egress, and MDM.</text>
</svg>