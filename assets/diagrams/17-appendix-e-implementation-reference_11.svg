<rect width="1280" height="860" fill="url(#a11bg)"/>

  <rect width="1280" height="72" fill="#0F172A"/>
  <text x="32" y="32" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Example A — Runtime &amp; infra mitigations</text>
  <text x="32" y="54" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">Cloud/agent runtime isolation, workspace write limits, egress deny-by-default, then approval policy before consequential actions.</text>
  <rect x="1112" y="22" rx="14" width="136" height="28" fill="#475569"/>
  <text x="1180" y="41" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">INFRA</text>

