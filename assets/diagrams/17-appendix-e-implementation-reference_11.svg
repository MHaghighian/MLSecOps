  <text x="600" y="254" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">mode on</text>
<path d="M542,240 L470,240 L470,300" fill="none" stroke="#047857" stroke-width="1.6" marker-end="url(#a11arrG)"/>
<path d="M658,240 L840,240 L840,300" fill="none" stroke="#047857" stroke-width="1.6" marker-end="url(#a11arrG)"/>
<rect x="350" y="300" width="240" height="70" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" filter="url(#a11soft)"/>
  <text x="470.0" y="324" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Writes → workspace only</text>
  <text x="470.0" y="344" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">deny .env · hooks · mcp.json · rules · CI</text>
<rect x="700" y="300" width="280" height="70" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" filter="url(#a11soft)"/>
  <text x="840.0" y="324" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Network deny-by-default</text>
  <text x="840.0" y="344" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">egress allowlist + kill switch (EA)</text>
