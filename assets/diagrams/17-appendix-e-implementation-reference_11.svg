<text x="52" y="128" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Cloud / agent runtime</text>
<rect x="52" y="148" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="182.0" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Setup phase</text>
  <text x="182.0" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">network ON · secrets for bootstrap</text>
<path d="M182,218 L182,248" fill="none" stroke="#0F172A" stroke-width="1.7" marker-end="url(#a11arr)"/>
<rect x="52" y="248" width="260" height="70" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="182.0" y="272" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Agent phase (hardened)</text>
  <text x="182.0" y="292" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">net OFF · secrets out · brokered tokens</text>
<text x="52" y="340" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#047857">Stops: env secret theft + open exfil</text>
<rect x="460" y="100" width="280" height="48" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" filter="url(#a11soft)"/>
  <text x="600.0" y="129" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Agent task starts</text>
<path d="M600,148 L600,180" fill="none" stroke="#0F172A" stroke-width="1.7" marker-end="url(#a11arr)"/>
<polygon points="600,182 658,240 600,298 542,240" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
