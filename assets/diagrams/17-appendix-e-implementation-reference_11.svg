  <text x="600" y="544" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">policy</text>
<path d="M530,530 L400,530" fill="none" stroke="#D97706" stroke-width="1.7" marker-end="url(#a11arr)"/>
<rect x="140" y="500" width="260" height="70" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" filter="url(#a11soft)"/>
