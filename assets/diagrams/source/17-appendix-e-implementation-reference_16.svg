<rect width="1480" height="940" fill="url(#c16bg)"/>

  <rect width="1480" height="72" fill="#0F172A"/>
  <text x="32" y="32" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Example C — Unsecured self-hosted serving platform</text>
  <text x="32" y="54" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">Unsigned weights on a shared GPU; global prefix KV; one cluster-wide identity; leftover pages and open egress.</text>
  <rect x="1312" y="22" rx="14" width="136" height="28" fill="#B91C1C"/>
  <text x="1380" y="41" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">UNSECURED</text>


  <rect x="40" y="100" width="210" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" filter="url(#c16soft)"/>
  <circle cx="56" cy="116" r="10" fill="#0F172A"/>
  <text x="56" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">1</text>
  <text x="72" y="120" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Calling apps</text>
  <text x="52" y="140" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">RAG · agents · batch</text>


  <rect x="280" y="100" width="210" height="56" rx="10" fill="#FFF1F2" stroke="#B91C1C" stroke-width="1.4" filter="url(#c16soft)"/>
  <circle cx="296" cy="116" r="10" fill="#B91C1C"/>
  <text x="296" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">2</text>
  <text x="312" y="120" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Edge (thin)</text>
  <text x="292" y="140" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">public Service / :8000</text>

<path d="M250,128 L280,128" fill="none" stroke="#0F172A" stroke-width="1.6" marker-end="url(#c16arr)"/>
<rect x="40" y="180" width="700" height="230" rx="14" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5" filter="url(#c16soft)"/>
<text x="56" y="208" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#9F1239">ARTIFACT PATH — NO ADMIT</text>

  <rect x="56" y="225" width="210" height="60" rx="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.4" filter="url(#c16soft)"/>
  <circle cx="72" cy="241" r="10" fill="#E11D48"/>
  <text x="72" y="245" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">4</text>
  <text x="88" y="245" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Registry</text>
  <text x="68" y="265" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">anyone can push</text>


  <rect x="286" y="225" width="210" height="60" rx="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.4" filter="url(#c16soft)"/>
  <circle cx="302" cy="241" r="10" fill="#E11D48"/>
  <text x="302" y="245" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">3</text>
  <text x="318" y="245" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Admission</text>
  <text x="298" y="265" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">:latest · no cosign</text>


  <rect x="516" y="225" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.4" filter="url(#c16soft)"/>
  <circle cx="532" cy="241" r="10" fill="#B91C1C"/>
  <text x="532" y="245" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">8</text>
  <text x="548" y="245" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">LoRA drop-in</text>
  <text x="528" y="265" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">unsigned adapter</text>


  <rect x="56" y="310" width="660" height="70" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.4" filter="url(#c16soft)"/>
  <circle cx="72" cy="326" r="10" fill="#B91C1C"/>
  <text x="72" y="330" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">11</text>
  <text x="88" y="330" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">CT pipeline</text>
  <text x="68" y="350" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">hot-reload adapter in prod — skips scan / sign / Evidence Pack</text>

<rect x="770" y="180" width="340" height="230" rx="14" fill="#FFFBEB" stroke="#D97706" filter="url(#c16soft)"/>
<text x="790" y="208" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="800" fill="#92400E">SHARED COMPUTE</text>

  <rect x="790" y="225" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4" filter="url(#c16soft)"/>
  <circle cx="806" cy="241" r="10" fill="#D97706"/>
  <text x="806" y="245" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">5</text>
  <text x="822" y="245" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">vLLM / KServe</text>
  <text x="802" y="265" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">one replica, all tenants</text>


  <rect x="790" y="300" width="140" height="80" rx="10" fill="#FFF1F2" stroke="#B91C1C" stroke-width="1.4" filter="url(#c16soft)"/>
  <circle cx="806" cy="316" r="10" fill="#B91C1C"/>
  <text x="806" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">6</text>
  <text x="822" y="320" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">GPU pool</text>
  <text x="802" y="340" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">time-slice only</text>


  <rect x="950" y="300" width="140" height="80" rx="10" fill="#FFF1F2" stroke="#B91C1C" stroke-width="1.4" filter="url(#c16soft)"/>
  <circle cx="966" cy="316" r="10" fill="#B91C1C"/>
  <text x="966" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">7</text>
  <text x="982" y="320" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">KV cache</text>
  <text x="962" y="340" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">global prefix ON</text>

<rect x="1140" y="180" width="300" height="230" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
<text x="1290" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#B91C1C">What fails</text>
<text x="1160" y="240" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Unsigned weights on GPU</text>
<text x="1160" y="265" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Adapter skips ModelScan</text>
<text x="1160" y="290" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Global prefix KV cache</text>
<text x="1160" y="315" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• One god ServiceAccount</text>
<text x="1160" y="340" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Public engine port</text>
<text x="1160" y="365" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Open pod egress</text>

  <rect x="40" y="440" width="340" height="70" rx="10" fill="#FFF1F2" stroke="#B91C1C" stroke-width="1.4" filter="url(#c16soft)"/>
  <circle cx="56" cy="456" r="10" fill="#B91C1C"/>
  <text x="56" y="460" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">9</text>
  <text x="72" y="460" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Serving identity</text>
  <text x="52" y="480" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">cluster-wide SA + one engine key</text>


  <rect x="400" y="440" width="340" height="70" rx="10" fill="#FFF1F2" stroke="#B91C1C" stroke-width="1.4" filter="url(#c16soft)"/>
  <circle cx="416" cy="456" r="10" fill="#B91C1C"/>
  <text x="416" y="460" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">10</text>
  <text x="432" y="460" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Network / egress</text>
  <text x="412" y="480" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">pods can phone home / mine</text>


  <rect x="760" y="440" width="340" height="70" rx="10" fill="#FFF1F2" stroke="#B91C1C" stroke-width="1.4" filter="url(#c16soft)"/>
  <circle cx="776" cy="456" r="10" fill="#B91C1C"/>
  <text x="776" y="460" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">7b</text>
  <text x="792" y="460" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Persisted form of #7</text>
  <text x="772" y="480" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">CAG/NFS dump · cluster-wide read</text>

<path d="M1020,380 C1100,380 1125,300 1140,278" fill="none" stroke="#B91C1C" stroke-width="2.2" marker-end="url(#c16arrR)"/>
<text x="1020" y="428" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#B91C1C">RED: B measures A's prefix (PromptPeek)</text>
<rect x="40" y="540" width="1400" height="90" rx="12" fill="#FFFFFF" stroke="#94A3B8"/>
<text x="60" y="575" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Naive mental model: &quot;if the apps do RAG ACL, the GPU is just infra.&quot;</text>
<text x="60" y="605" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">Reality: shared prefix KV, leftover GPU pages, and unsigned adapters are platform leaks — they bypass application ACL.</text>
<text x="60" y="680" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B">Components 1–11 match the Example C table.</text>
<rect x="40" y="720" width="1400" height="160" rx="12" fill="#FFFFFF" stroke="#B91C1C"/>
<text x="60" y="755" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#B91C1C">Red paths on this diagram</text>
<text x="60" y="790" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Hugging Face :latest → GPU with no ModelScan / cosign</text>
<text x="60" y="820" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Tenant B times TTFT against Tenant A's cached system prefix</text>
<text x="60" y="850" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Session ends; next job reconstructs leftover KV / GPU residue</text>
</svg>