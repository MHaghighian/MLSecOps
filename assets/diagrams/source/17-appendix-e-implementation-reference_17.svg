<text x="1096" y="490" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#0F172A">OFF or tenant-scoped on sensitive tiers — never global sticky prefix.</text>
<rect x="36" y="560" width="1508" height="100" rx="12" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="56" y="590" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#047857">Primary enforcement chain</text>
<text x="56" y="618" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">signed artifact → admit to GPU tier → gateway engine authN → KV key bind → generate → session cleanup</text>
<text x="56" y="642" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">A correct engine key does not make Bob's chunks legal in Alice's prompt. Application ACL stays in Plane A (B/D).</text>
<rect x="36" y="680" width="740" height="260" rx="12" fill="#FFFFFF" stroke="#94A3B8"/>
<text x="56" y="710" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Two identities</text>
<text x="56" y="745" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Engine key / SA: may this caller hit this replica?</text>
<text x="56" y="775" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">App user token: whose data is in the prompt? (not here)</text>
<text x="56" y="815" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#B91C1C">Anti-pattern: one cluster-wide ServiceAccount</text>
<text x="56" y="845" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#B91C1C">Anti-pattern: prefix cache ON for multi-tenant GPU</text>
<text x="56" y="875" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#B91C1C">Anti-pattern: LoRA hot-load from an unsigned blob</text>
