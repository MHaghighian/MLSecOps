<rect x="36" y="550" width="1020" height="90" rx="14" fill="#FFFBEB" stroke="#D97706" filter="url(#c17soft)"/>
<text x="56" y="580" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="800" fill="#92400E">Prefix cache = security setting (PromptPeek / CVE-2025-46570)</text>
<text x="56" y="610" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">High: OFF or per-tenant replica. Else: gateway OVERWRITES cache_salt=tenant. Never forward client salt.</text>
<rect x="1076" y="550" width="468" height="90" rx="14" fill="#FFFFFF" stroke="#94A3B8"/>
<text x="1096" y="580" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="800" fill="#0F172A">MIG note (K8s vs VM)</text>
<text x="1096" y="610" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B">K8s MIG OK for pods; VM multi-tenant needs vGPU.</text>
<rect x="36" y="660" width="1508" height="100" rx="12" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="56" y="690" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#047857">Primary enforcement chain</text>
<text x="56" y="718" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">signed + format-safe artifact → fail-closed admit → GPU tier → gateway authN+authZ → overwrite salt → generate → purge KV</text>
<text x="56" y="742" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">Caller→engine ≠ RAG ACL. Shared-process batching ≠ OS isolation. LeftoverLocals ≠ NVIDIA (KV/VRAM still matters).</text>
<rect x="36" y="780" width="740" height="280" rx="12" fill="#FFFFFF" stroke="#94A3B8"/>
<text x="56" y="810" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Two identities + AuthZ</text>
<text x="56" y="845" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Engine key / mTLS: may this caller hit this replica?</text>
<text x="56" y="875" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Gateway AuthZ: tenant · model · LoRA · tier · quota</text>
<text x="56" y="905" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">App user token: whose data is in the prompt? (not here)</text>
<text x="56" y="940" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#B91C1C">Anti-pattern: cluster-wide long-lived engine key</text>
<text x="56" y="970" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#B91C1C">Anti-pattern: forward client cache_salt / use MPS as isolation</text>
<text x="56" y="1000" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#B91C1C">Anti-pattern: client-supplied adapter_id / LoRA path</text>
