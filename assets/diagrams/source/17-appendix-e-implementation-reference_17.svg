  <text x="1108" y="385" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">no public :8000</text>

<rect x="1076" y="430" width="468" height="100" rx="14" fill="#FFFBEB" stroke="#D97706" filter="url(#c17soft)"/>
