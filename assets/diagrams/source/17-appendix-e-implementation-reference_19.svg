  <rect x="790" y="230" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.4" filter="url(#d19soft)"/>
  <circle cx="806" cy="246" r="10" fill="#B91C1C"/>
  <text x="806" y="250" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">10</text>
  <text x="822" y="250" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Background worker</text>
  <text x="802" y="270" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">tools always on</text>


  <rect x="790" y="305" width="300" height="70" rx="10" fill="#FFF1F2" stroke="#B91C1C" stroke-width="1.4" filter="url(#d19soft)"/>
  <circle cx="806" cy="321" r="10" fill="#B91C1C"/>
  <text x="806" y="325" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">12</text>
  <text x="822" y="325" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">CRM_TOKEN=admin</text>
  <text x="802" y="345" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">NHI is the deputy</text>

<rect x="1140" y="180" width="300" height="220" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
<text x="1290" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#B91C1C">What fails</text>
<text x="1160" y="240" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Tools bound in public chat</text>
<text x="1160" y="265" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Anonymous account RAG</text>
<text x="1160" y="290" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Mixed KB + all orders</text>
<text x="1160" y="315" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Queue text = policy</text>
<text x="1160" y="340" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• CRM-admin worker</text>
<text x="1160" y="365" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• No CSRF on /act</text>

  <rect x="40" y="430" width="340" height="70" rx="10" fill="#FFF1F2" stroke="#B91C1C" stroke-width="1.4" filter="url(#d19soft)"/>
  <circle cx="56" cy="446" r="10" fill="#B91C1C"/>
  <text x="56" y="450" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">9</text>
  <text x="72" y="450" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Job queue</text>
  <text x="52" y="470" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">chat transcript trusted as instructions</text>


  <rect x="400" y="430" width="340" height="70" rx="10" fill="#FFF1F2" stroke="#B91C1C" stroke-width="1.4" filter="url(#d19soft)"/>
  <circle cx="416" cy="446" r="10" fill="#B91C1C"/>
