  <text x="88" y="245" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Orchestrator</text>
  <text x="68" y="265" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">retrieve + dispatch</text>


