  <text x="428" y="330" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Any customer's order</text>
  <text x="408" y="350" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">filter from chat text</text>

<rect x="770" y="180" width="340" height="220" rx="14" fill="#EFF6FF" stroke="#B91C1C" filter="url(#d19soft)"/>
