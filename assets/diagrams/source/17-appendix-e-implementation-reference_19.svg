  <text x="88" y="330" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">KB + accounts soup</text>
  <text x="68" y="350" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">no labels / no RLS</text>


  <rect x="396" y="310" width="320" height="60" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.4" filter="url(#d19soft)"/>
