  <rect width="1480" height="72" fill="#0F172A"/>
  <text x="32" y="32" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Example D — Unsecured support website</text>
  <text x="32" y="54" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">One tool-bound loop for anonymous and logged-in users; mixed KB+accounts soup; CRM-admin worker.</text>
