  <text x="620.0" y="714" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">brokered user token in header — never in model context</text>

  <rect x="400" y="748" width="349.0" height="20" rx="6" fill="#ECFDF5" stroke="#059669"/>
  <text x="408" y="762" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#065F46">MIT: Credential Broker + MCP Gateway + downstream authZ</text>

