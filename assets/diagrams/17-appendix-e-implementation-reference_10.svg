  <text x="48" y="784" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#065F46">MIT: write-path deny for rules/mcp.json/hooks · no imperative-as-policy</text>

<path d="M180,645 C180,500 300,230 390,210" fill="none" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a10arrR)"/>
