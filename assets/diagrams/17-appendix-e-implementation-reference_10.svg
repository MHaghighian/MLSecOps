<text x="200" y="536" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748B">(still untrusted data)</text>
<rect x="32" y="860" width="1216" height="88" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
<text x="52" y="890" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#047857">Axiom</text>
<text x="52" y="912" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Memory / RAG / tool_result can be poisoned — treat as untrusted DATA. Never let them grant tools, set payee/path/account, or rewrite rules.</text>
<text x="52" y="934" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">Stop unauthorized ACTION at Intent Gate + param binding + brokered token + egress/write deny. Sanitize-on-write is supporting only.</text>
