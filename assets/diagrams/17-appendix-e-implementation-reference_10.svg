  <rect width="1280" height="72" fill="#0F172A"/>
  <text x="32" y="32" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Example A — Agent loop: flow + mitigations + memory</text>
  <text x="32" y="54" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">Payload can enter at context assembly or tool_result. Actions die at the policy diamond. Memory is untrusted data, not policy.</text>
