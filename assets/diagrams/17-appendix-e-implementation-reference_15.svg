<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1100" viewBox="0 0 1480 1100">

  <defs>
    <marker id="b15arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F172A"/>
    </marker>
    <marker id="b15arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <marker id="b15arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/>
    </marker>
    <filter id="b15soft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="b15bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
  </defs>

<rect width="1480" height="1100" fill="url(#b15bg)"/>

  <rect width="1480" height="72" fill="#0F172A"/>
  <text x="32" y="32" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Example B — Ingest + chat data flows</text>
  <text x="32" y="54" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">Left: upload path (write). Right: chat path (read). Both stamp and filter from verified identity — never from the client body.</text>
  <rect x="1312" y="22" rx="14" width="136" height="28" fill="#0F766E"/>
  <text x="1380" y="41" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">DATA FLOW</text>

<rect x="36" y="95" width="700" height="40" rx="8" fill="#ECFDF5" stroke="#059669"/>
<text x="386" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#065F46">PATH 1 — INGEST (write)</text>

  <circle cx="60" cy="174" r="14" fill="#059669"/>
  <text x="60" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff">I1</text>
  <rect x="90" y="150" width="620" height="48" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
  <text x="106" y="170" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Authenticate upload</text>
  <text x="106" y="188" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">JWT → tenant_id + user_id</text>


  <circle cx="60" cy="234" r="14" fill="#059669"/>
  <text x="60" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff">I2</text>
  <rect x="90" y="210" width="620" height="48" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
  <text x="106" y="230" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Ingest gates</text>
  <text x="106" y="248" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">type allowlist · size · AV · decompress limits · hash</text>


  <circle cx="60" cy="294" r="14" fill="#2563EB"/>
  <text x="60" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff">I3</text>
  <rect x="90" y="270" width="620" height="48" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
  <text x="106" y="290" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Store object</text>
  <text x="106" y="308" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">key = tenant/user/uuid — IAM prefix isolation</text>


  <circle cx="60" cy="354" r="14" fill="#059669"/>
  <text x="60" y="358" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff">I4</text>
  <rect x="90" y="330" width="620" height="48" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
  <text x="106" y="350" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Chunk + embed</text>
  <text x="106" y="368" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">server stamps metadata (owner, tenant, acl, hash)</text>


  <circle cx="60" cy="414" r="14" fill="#059669"/>
  <text x="60" y="418" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff">I5</text>
  <rect x="90" y="390" width="620" height="48" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
  <text x="106" y="410" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Upsert into tenant partition only</text>
  <text x="106" y="428" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">private ACL by default; shares are explicit rows</text>

<rect x="760" y="95" width="680" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
<text x="1100" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#2563EB">PATH 2 — CHAT (read)</text>

  <circle cx="790" cy="174" r="14" fill="#059669"/>
  <text x="790" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff">C1</text>
  <rect x="820" y="150" width="600" height="48" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
  <text x="836" y="170" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Authenticate chat</text>
  <text x="836" y="188" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">same verified claims — discard body tenant/user</text>


  <circle cx="790" cy="234" r="14" fill="#059669"/>
  <text x="790" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff">C2</text>
  <rect x="820" y="210" width="600" height="48" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
  <text x="836" y="230" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">build_prefilter(claims)</text>
  <text x="836" y="248" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">partition ∩ (owner ∪ shares ∪ groups)</text>


  <circle cx="790" cy="294" r="14" fill="#059669"/>
  <text x="790" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff">C3</text>
  <rect x="820" y="270" width="600" height="48" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
  <text x="836" y="290" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">ANN search with pre-filter</text>
  <text x="836" y="308" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">unauthorized vectors never become candidates</text>


  <circle cx="790" cy="354" r="14" fill="#059669"/>
  <text x="790" y="358" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff">C4</text>
  <rect x="820" y="330" width="600" height="48" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
  <text x="836" y="350" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Output Gate</text>
  <text x="836" y="368" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">hits enter prompt as DATA, not instructions</text>


  <circle cx="790" cy="414" r="14" fill="#D97706"/>
  <text x="790" y="418" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff">C5</text>
  <rect x="820" y="390" width="600" height="48" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
  <text x="836" y="410" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">LLM complete (no tools)</text>
  <text x="836" y="428" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">answer text only — pipeline shape</text>


  <circle cx="790" cy="474" r="14" fill="#2563EB"/>
  <text x="790" y="478" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff">C6</text>
  <rect x="820" y="450" width="600" height="48" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
  <text x="836" y="470" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">CSP-hardened render</text>
  <text x="836" y="488" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B">no remote img/connect · encode markdown</text>

<rect x="36" y="480" width="700" height="200" rx="12" fill="#FFFFFF" stroke="#047857"/>
<text x="56" y="510" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#047857">Identity is the spine</text>
<text x="56" y="540" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Upload and chat both derive tenancy from the token.</text>
<text x="56" y="565" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">The model never sees credentials and never sets filters.</text>
<text x="56" y="590" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Poisoned files stay under the uploader's ACL;</text>
<text x="56" y="615" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">they cannot widen retrieval for other users.</text>
<text x="56" y="650" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">If you add tools later → Example A gates.</text>
<rect x="760" y="520" width="680" height="160" rx="12" fill="#FFFFFF" stroke="#B91C1C"/>
<text x="780" y="550" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#B91C1C">Attacks stopped on this diagram</text>
<text x="780" y="580" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Client forges tenant_id / user_id</text>
<text x="780" y="605" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Alice retrieves Bob's private doc</text>
<text x="780" y="630" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Markdown image phones home (EchoLeak-class)</text>
<text x="780" y="655" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">• Upload becomes global corpus without ownership</text>
<rect x="36" y="720" width="1404" height="100" rx="12" fill="#FFFFFF" stroke="#94A3B8"/>
<text x="56" y="755" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#0F172A">Honest residual</text>
<text x="56" y="780" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">A user can still receive a wrong summary of a file they own if that file is poisoned (LLM09).</text>
<text x="56" y="805" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">Deliberate oversharing and shared-inference KV side channels are out of band for RAG ACL — see Ch.7 KV Cache / Example C.</text>
<rect x="36" y="850" width="1404" height="200" rx="12" fill="#ECFDF5" stroke="#059669"/>
<text x="56" y="880" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#065F46">Pseudo-code (chat)</text>
<text x="56" y="910" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">claims = verify_jwt(req)</text>
<text x="56" y="935" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">filt = build_prefilter(claims)          # NOT from req.json</text>
<text x="56" y="960" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">hits = search(tenant_ns(claims.tenant), q, prefilter=filt)</text>
<text x="56" y="985" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">return render(llm(user=q, data=output_gate(hits)), csp=LOCKDOWN)</text>
<text x="56" y="1020" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">No tools bound by default.</text>
</svg>