<rect x="1120" y="210" width="320" height="500" rx="14" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5" filter="url(#soft)"/>
<text x="1140" y="242" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#B91C1C">What fails by construction</text>
<text x="1140" y="270" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0F172A">• No retrieval ACL — any indexed chunk</text>
<text x="1140" y="306" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0F172A">  can reach any developer session</text>
<text x="1140" y="342" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0F172A">• No Output Gate — retrieved text is</text>
<text x="1140" y="378" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0F172A">  treated as instructions</text>
<text x="1140" y="414" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0F172A">• No Intent Gate — model proposal</text>
<text x="1140" y="450" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0F172A">  = execution</text>
<text x="1140" y="486" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0F172A">• No MCP allowlist / schema pin</text>
<text x="1140" y="522" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0F172A">• Secrets travel inside the prompt</text>
<text x="1140" y="558" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0F172A">• Egress unrestricted → exfil</text>
<text x="1140" y="594" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0F172A">• Writes allowed to .env, mcp.json,</text>
<text x="1140" y="630" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0F172A">  hooks, CI, rules</text>
<text x="1140" y="666" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#0F172A">• Sub-agents inherit full scope</text>
