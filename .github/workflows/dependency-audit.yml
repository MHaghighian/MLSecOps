# Continuous dependency vulnerability audit for handbook build requirements.
# Complements Dependabot PRs with a blocking pip-audit signal on PRs and a weekly schedule.
name: Dependency Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "requirements-pages.txt"
      - "scripts/requirements-docx.txt"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (pages + docx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-pages.txt
          pip-audit -r scripts/requirements-docx.txt
