# Compile DOCX (and PDF when LibreOffice succeeds) and attach to GitHub Releases on version tags.
name: Handbook Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to update with handbook files (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-handbook:
    name: Build DOCX/PDF
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer

      - name: Install Python docx requirements
        run: |
          pip install -r scripts/requirements-docx.txt
          playwright install --with-deps chromium

      - name: Compile handbook DOCX
        run: python scripts/build-docx.py --render-mermaid

      - name: Convert DOCX to PDF (best effort)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.docx)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No DOCX produced under dist/" >&2
            exit 1
          fi
          libreoffice --headless --convert-to pdf --outdir dist/ "${files[@]}" || {
            echo "::warning::PDF conversion failed; DOCX will still be attached"
          }
          sha256sum dist/* > dist/HANDBOOK-SHA256SUMS.txt

      - name: Upload artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: handbook-dist
          path: |
            dist/*.docx
            dist/*.pdf
            dist/HANDBOOK-SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to GitHub Release (preserve draft status)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.docx dist/*.pdf dist/HANDBOOK-SHA256SUMS.txt)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No handbook assets found in dist/" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --draft \
              --title "MLSecOps $RELEASE_TAG" \
              --notes "Handbook DOCX/PDF artifacts for $RELEASE_TAG. Publish via Create Release workflow or Release UI after adding SHA256SUMS."
          fi
