name: Create Release

# Manual workflow — source/docs release + integrity manifest. See RELEASING.md
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.5.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          tag = os.environ["TAG"].strip()
          ver = tag.lstrip("v")
          body_file = Path("releases") / f"{tag}-RELEASE-BODY.md"

          lines = [
              f"# MLSecOps Reference Model & Practical Guide {tag}",
              "",
              "Public release of the MLSecOps Reference Model & Practical Guide.",
              "",
              "## Downloads",
              "- **Documentation:** https://mhaghighian.github.io/MLSecOps/",
              "- **Source:** this repository (`chapters-en/`, `schemas/`, `policies/`)",
              "- **Integrity:** `SHA256SUMS` + `SHA256SUMS.sigstore.json` (see `RELEASE-INTEGRITY.md`)",
              "- **Word / PDF:** attached automatically by the Handbook Artifacts workflow on release tags (or locally via `python scripts/build-docx.py --render-mermaid`)",
              "",
          ]

          if body_file.is_file():
              lines.extend(["## Release Notes", body_file.read_text(encoding="utf-8").strip(), ""])
          else:
              changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
              m = re.search(rf"(?ms)^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", changelog)
              if m:
                  lines.extend([f"## Changelog ({tag})", "", m.group(1).strip(), ""])
              else:
                  lines.extend(["## Changelog", "See CHANGELOG.md for release history.", ""])

          Path("release-notes.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Generate SHA256SUMS
        run: python scripts/generate_release_manifest.py -o SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign SHA256SUMS (keyless)
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: MLSecOps ${{ inputs.tag }}
          body_path: release-notes.md
          draft: true
          prerelease: ${{ contains(inputs.tag, '-') }}
          files: |
            SHA256SUMS
            SHA256SUMS.sigstore.json
