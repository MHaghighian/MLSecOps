name: Docs check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mkdocs:
    name: MkDocs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.txt

      - name: Install MkDocs
        run: pip install -r requirements-pages.txt

      - name: Prepare docs source
        run: python .github/prepare_pages.py

      - name: Build site (strict)
        run: mkdocs build --strict

  policy-and-schema:
    name: Evidence Pack Schema & OPA Policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Evidence Pack JSON Schema & fixtures
        run: |
          python -m pip install --upgrade check-jsonschema jsonschema
          check-jsonschema --schemafile schemas/evidence-pack.schema.json \
            schemas/examples/evidence-pack.example.json \
            policies/testdata/evidence-pack.fail-digest.json \
            policies/testdata/evidence-pack.fail-unpinned-mcp.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, ValidationError

          schema = json.loads(Path("schemas/evidence-pack.schema.json").read_text(encoding="utf-8"))
          v = Draft202012Validator(schema)
          base = json.loads(Path("schemas/examples/evidence-pack.example.json").read_text(encoding="utf-8"))

          managed_ok = json.loads(json.dumps(base))
          managed_ok["specVersion"] = "1.7"
          managed_ok["metadata"]["systemScope"] = "Managed-API"
          managed_ok.pop("modelArtifact", None)
          managed_ok["managedApiConfig"] = {"configSnapshotHash": "sha256:" + "a" * 64}
          v.validate(managed_ok)

          for mutator, label in [
              (lambda d: d.pop("managedApiConfig", None), "Managed-API without managedApiConfig"),
              (lambda d: d.pop("modelArtifact", None), "Non-managed without modelArtifact"),
          ]:
              sample = json.loads(json.dumps(managed_ok if "managed" in label.lower() and label.startswith("Managed") else base))
              mutator(sample)
              try:
                  v.validate(sample)
              except ValidationError:
                  continue
              raise SystemExit(f"Expected ValidationError for {label}")
          print("Conditional schema checks passed.")
          PY

      - name: Install and verify Conftest (SHA-256 pinned)
        env:
          CONFTEST_VERSION: "0.71.1"
          CONFTEST_SHA256: "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985"
        run: |
          set -euo pipefail
          archive="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/${archive}"
          echo "${CONFTEST_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" conftest
          install -m 0755 conftest "$RUNNER_TEMP/conftest"
          rm -f conftest "${archive}"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run Rego unit tests and Evidence Pack fixture assertions
        run: |
          set -euo pipefail
          conftest --version
          conftest verify --policy policies
          conftest test --policy policies schemas/examples/evidence-pack.example.json

          if out=$(conftest test --policy policies policies/testdata/evidence-pack.fail-digest.json 2>&1); then
            echo "Expected evidence-pack.fail-digest.json to fail Conftest" >&2
            exit 1
          fi
          echo "$out" | grep -q "CRITICAL \[CP8->CP9\]"

          if out=$(conftest test --policy policies policies/testdata/evidence-pack.fail-unpinned-mcp.json 2>&1); then
            echo "Expected evidence-pack.fail-unpinned-mcp.json to fail Conftest" >&2
            exit 1
          fi
          echo "$out" | grep -q "CRITICAL \[Ch.8 MCP09\]"
