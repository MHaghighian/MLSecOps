name: Docs check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mkdocs:
    name: MkDocs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.txt

      - name: Install MkDocs
        run: pip install -r requirements-pages.txt

      - name: Prepare docs source
        run: python .github/prepare_pages.py

      - name: Build site (strict)
        run: mkdocs build --strict

  policy-and-schema:
    name: Policy, Schema & Repo Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.txt

      - name: Install verification dependencies
        run: |
          pip install -r requirements-pages.txt
          python -m pip install --upgrade check-jsonschema jsonschema pyyaml beautifulsoup4

      - name: Run check-jsonschema on Evidence Pack examples & fixtures
        run: |
          check-jsonschema --schemafile schemas/evidence-pack.schema.json \
            schemas/examples/evidence-pack.example.json \
            schemas/examples/evidence-pack.managed-api.example.json \
            policies/testdata/evidence-pack.fail-digest.json \
            policies/testdata/evidence-pack.fail-unpinned-mcp.json

      - name: Install and verify Conftest (SHA-256 pinned)
        env:
          CONFTEST_VERSION: "0.71.1"
          CONFTEST_SHA256: "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985"
        run: |
          set -euo pipefail
          archive="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/${archive}"
          echo "${CONFTEST_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" conftest
          install -m 0755 conftest "$RUNNER_TEMP/conftest"
          rm -f conftest "${archive}"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run full repository & policy verification suite
        run: python scripts/verify_repo.py --require-conftest --with-mkdocs
