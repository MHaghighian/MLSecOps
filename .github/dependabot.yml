# Keep GitHub Actions and Python docs tooling current (OpenSSF / supply-chain hygiene).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # requirements-pages.txt drives the MkDocs site build
