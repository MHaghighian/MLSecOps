apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference-fail
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
